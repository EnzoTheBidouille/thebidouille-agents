name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Structural invariants (commands, agents, pins, cross-refs, installers)
        run: node scripts/validate-core.mjs

      # validate-core is structural — it cannot see verdict logic. This runs the
      # workflow scripts against stub agents and asserts the outcomes, notably
      # that a dead reviewer never scores SHIP (zero findings from a crashed
      # reviewer is byte-identical to a clean surface).
      - name: Workflow behaviour tests
        run: node scripts/test-workflows.mjs

      - name: Syntax-check CLI + dashboard server
        run: |
          node --check bin/cli.js
          for f in dashboard/server/*.js; do node --check "$f"; done

      - name: Syntax-check gate hook
        run: python3 -m py_compile core/hooks/gate.py

      # The gate can BLOCK a user's command, and py_compile proves only that it
      # parses. This drives the real stdin→stdout contract: deny/ask tiers,
      # chained-command splitting, branch-conditional gating resolved at the
      # payload cwd, the bypassPermissions ask⇒deny escalation, the preflight
      # phase gate, and worktree-aware HEAD matching.
      - name: Gate hook behaviour tests
        run: node scripts/test-gate.mjs

      # The dashboard server is shipped runtime code: a hand-rolled YAML parser
      # every /doctor check derives from, a metrics aggregator, the JS port of
      # /doctor, the board parser, the fleet registry — plus the HTTP guards that
      # are the only thing standing between a web page and the local agent.
      - name: Dashboard server tests
        run: node scripts/test-dashboard.mjs

      # The metrics collector reports money. Its failure mode is not a crash but a
      # confidently wrong number — double-billed responses, runs split by a background
      # agent's completion notice, subagent spend attributed nowhere. Each of those is
      # pinned by a case here.
      - name: Metrics collector tests
        run: node scripts/test-metrics.mjs

      - name: Shell-check installers (syntax)
        run: bash -n install.sh && sh -n install.sh

      - name: Dry-run install into a scratch HOME
        run: |
          scratch=$(mktemp -d)
          # ./ is load-bearing: without a slash in $0 the installer clones
          # GitHub main instead of installing the checked-out working tree
          HOME="$scratch" sh ./install.sh --global
          test -f "$scratch/.claude/pipeline/VERSION"
          test -f "$scratch/.claude/agents/smoke.md"
          test -f "$scratch/.claude/commands/build.md"
          grep -q "^model: sonnet" "$scratch/.claude/commands/build.md"
          # Every caller chains these with `|| true`, so one the installer forgets
          # is a silent no-op on the user's machine, never an error. Assert them.
          test -x "$scratch/.claude/pipeline/scripts/telemetry-send.sh"
          test -x "$scratch/.claude/pipeline/scripts/kanban-move.sh"
          test -x "$scratch/.claude/pipeline/scripts/preflight.sh"
          test -f "$scratch/.claude/pipeline/CHANGELOG.md"
          # Workflow variants + their phase-0 agent must ship together.
          test -f "$scratch/.claude/workflows/review.js"
          test -f "$scratch/.claude/workflows/audit.js"
          test -f "$scratch/.claude/workflows/refactor.js"
          test -f "$scratch/.claude/agents/profile-reader.md"
          # Install a SECOND time before asserting the hook: until 1.3.2 the
          # registration appended if-absent behind a quote-blind "already?" test,
          # so every re-install added another copy (gate.py then ran once per
          # copy). One install could never surface it — CI stayed green while
          # users accumulated four.
          HOME="$scratch" sh ./install.sh --update --global
          node scripts/assert-gate-hook.mjs "$scratch/.claude/settings.json"

      # bin/cli.js is what `npx cohorte install/update` actually runs — a
      # hand-written port of install.sh, so it drifts silently (until 1.2.4 it
      # copied neither shipped script nor the CHANGELOG). Assert the same
      # postconditions against the port, not just the shell original.
      - name: Dry-run the npx CLI into a scratch HOME
        run: |
          scratch=$(mktemp -d)
          # CLAUDE_CONFIG_DIR, not HOME: the CLI honours it on every platform,
          # while HOME is ignored on Windows (os.homedir reads USERPROFILE there).
          CLAUDE_CONFIG_DIR="$scratch/.claude" node bin/cli.js install --global
          test -f "$scratch/.claude/pipeline/VERSION"
          test -f "$scratch/.claude/commands/build.md"
          # The command is useless without the agent it dispatches: until 1.2.6 this
          # port copied a hardcoded review+release and shipped /smoke with no `smoke`
          # agent. The shell dry-run above asserted it; this one didn't, so CI stayed
          # green. Assert every non-template agent here too.
          test -f "$scratch/.claude/agents/smoke.md"
          test -f "$scratch/.claude/agents/review.md"
          test -f "$scratch/.claude/agents/release.md"
          test -f "$scratch/.claude/agents/profile-reader.md"
          test ! -e "$scratch/.claude/agents/implementer.template.md"
          test -x "$scratch/.claude/pipeline/scripts/telemetry-send.sh"
          test -x "$scratch/.claude/pipeline/scripts/kanban-move.sh"
          test -x "$scratch/.claude/pipeline/scripts/preflight.sh"
          test -f "$scratch/.claude/pipeline/CHANGELOG.md"
          test -f "$scratch/.claude/workflows/review.js"
          test -f "$scratch/.claude/workflows/audit.js"
          test -f "$scratch/.claude/workflows/refactor.js"
          # The per-project rendered scripts must NOT ship — only their templates.
          test ! -e "$scratch/.claude/pipeline/scripts/new-feature.sh"
          test -f "$scratch/.claude/pipeline/scripts/new-feature.sh.template"
          # Same double-install assertion as the shell dry-run. This port is where
          # the duplicate actually bit (npx is the documented install route), and
          # its quote-blind check was a straight copy of the shell one's bug.
          CLAUDE_CONFIG_DIR="$scratch/.claude" node bin/cli.js update --global
          node scripts/assert-gate-hook.mjs "$scratch/.claude/settings.json"

      # Bundled (per-project) mode has its own postconditions the --global runs
      # can't see: the committed .claude/ payload and the specs/ seed.
      - name: Dry-run the npx CLI in project mode
        run: |
          scratch=$(mktemp -d)
          node bin/cli.js install "$scratch"
          test -f "$scratch/.claude/pipeline/VERSION"
          test -f "$scratch/.claude/hooks/gate.py"
          test -f "$scratch/.claude/agents/smoke.md"
          test -f "$scratch/specs/_template.md"

      # The tarball is the release artifact — assert what it does and does NOT
      # carry. `.npmignore` is INERT under an explicit package.json `files`
      # allowlist, so its `__pycache__/` rule never fired: a maintainer who had
      # compiled gate.py (this job does, one step above) shipped their machine's
      # bytecode cache. Only the `files` negations actually exclude it.
      - name: Assert the npm tarball carries no build artifacts
        run: |
          python3 -m py_compile core/hooks/gate.py   # make the cache exist first
          test -d core/hooks/__pycache__
          npm pack --dry-run --ignore-scripts 2>&1 | tee /tmp/pack.txt
          if grep -qiE '__pycache__|\.pyc' /tmp/pack.txt; then
            echo "::error::the npm tarball contains Python bytecode — fix package.json files negations"
            exit 1
          fi
          grep -q 'core/hooks/gate.py' /tmp/pack.txt   # …while still shipping the hook itself
          rm -rf core/hooks/__pycache__

      - name: Assert installs never copy __pycache__
        run: |
          python3 -m py_compile core/hooks/gate.py
          scratch=$(mktemp -d)
          CLAUDE_CONFIG_DIR="$scratch/.claude" node bin/cli.js install --global
          HOME="$scratch/sh" sh ./install.sh --global
          test -f "$scratch/.claude/hooks/gate.py"
          test ! -e "$scratch/.claude/hooks/__pycache__"
          test ! -e "$scratch/sh/.claude/hooks/__pycache__"
          rm -rf core/hooks/__pycache__

      - name: Build dashboard
        run: npm run build:dashboard

  validate-windows:
    # install.ps1 re-implements the hook reconcile in PowerShell — a regression
    # there ships to every Windows user while the Linux jobs stay green (the
    # 1.3.2 failure mode). Same double-install + assert as the sh/cli dry-runs,
    # plus bin/cli.js on win32 (its `py "…gate.py"` quoting is platform-specific).
    name: Validate installers (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Dry-run install.ps1 twice + assert the hook
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'coh-ps'
          .\install.ps1 -Global
          .\install.ps1 -Update -Global
          node scripts/assert-gate-hook.mjs (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json')

      - name: Dry-run the npx CLI twice + assert the hook (win32 quoting)
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'coh-cli'
          node bin/cli.js install --global
          node bin/cli.js update --global
          node scripts/assert-gate-hook.mjs (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json')
