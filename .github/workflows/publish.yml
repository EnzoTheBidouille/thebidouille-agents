name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # create the vX.Y.Z tag + GitHub release
  id-token: write # npm provenance / trusted publishing (OIDC)

jobs:
  check:
    name: Sanity check
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.local }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check CLI
        run: node --check bin/cli.js

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Compare local vs published version
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || echo "none")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL not yet published (registry has $PUBLISHED) — will publish."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already published — skipping."
          fi

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Token-less "trusted publishing" via OIDC needs npm >= 11.5.1;
      # Node 20 ships npm 10.x, so upgrade npm first. The trusted publisher
      # for this repo/workflow is configured on npmjs.com (package Settings).
      # NPM_TOKEN is a fallback if ever needed; unset is fine with OIDC.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git fetch --tags --quiet
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
