name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Structural invariants (commands, agents, pins, cross-refs, installers)
        run: node scripts/validate-core.mjs

      - name: Syntax-check CLI + dashboard server
        run: |
          node --check bin/cli.js
          for f in dashboard/server/*.js; do node --check "$f"; done

      - name: Syntax-check gate hook
        run: python3 -m py_compile core/hooks/gate.py

      - name: Shell-check installers (syntax)
        run: bash -n install.sh && sh -n install.sh

      - name: Dry-run install into a scratch HOME
        run: |
          scratch=$(mktemp -d)
          # ./ is load-bearing: without a slash in $0 the installer clones
          # GitHub main instead of installing the checked-out working tree
          HOME="$scratch" sh ./install.sh --global
          test -f "$scratch/.claude/pipeline/VERSION"
          test -f "$scratch/.claude/agents/smoke.md"
          test -f "$scratch/.claude/commands/build.md"
          grep -q "^model: sonnet" "$scratch/.claude/commands/build.md"
          # Every caller chains these with `|| true`, so one the installer forgets
          # is a silent no-op on the user's machine, never an error. Assert them.
          test -x "$scratch/.claude/pipeline/scripts/telemetry-send.sh"
          test -x "$scratch/.claude/pipeline/scripts/kanban-move.sh"
          test -x "$scratch/.claude/pipeline/scripts/preflight.sh"
          test -f "$scratch/.claude/pipeline/CHANGELOG.md"
          # Workflow variants + their phase-0 agent must ship together.
          test -f "$scratch/.claude/workflows/review.js"
          test -f "$scratch/.claude/workflows/audit.js"
          test -f "$scratch/.claude/workflows/refactor.js"
          test -f "$scratch/.claude/agents/profile-reader.md"

      # bin/cli.js is what `npx cohorte install/update` actually runs — a
      # hand-written port of install.sh, so it drifts silently (until 1.2.4 it
      # copied neither shipped script nor the CHANGELOG). Assert the same
      # postconditions against the port, not just the shell original.
      - name: Dry-run the npx CLI into a scratch HOME
        run: |
          scratch=$(mktemp -d)
          # CLAUDE_CONFIG_DIR, not HOME: the CLI honours it on every platform,
          # while HOME is ignored on Windows (os.homedir reads USERPROFILE there).
          CLAUDE_CONFIG_DIR="$scratch/.claude" node bin/cli.js install --global
          test -f "$scratch/.claude/pipeline/VERSION"
          test -f "$scratch/.claude/commands/build.md"
          # The command is useless without the agent it dispatches: until 1.2.6 this
          # port copied a hardcoded review+release and shipped /smoke with no `smoke`
          # agent. The shell dry-run above asserted it; this one didn't, so CI stayed
          # green. Assert every non-template agent here too.
          test -f "$scratch/.claude/agents/smoke.md"
          test -f "$scratch/.claude/agents/review.md"
          test -f "$scratch/.claude/agents/release.md"
          test -f "$scratch/.claude/agents/profile-reader.md"
          test ! -e "$scratch/.claude/agents/implementer.template.md"
          test -x "$scratch/.claude/pipeline/scripts/telemetry-send.sh"
          test -x "$scratch/.claude/pipeline/scripts/kanban-move.sh"
          test -x "$scratch/.claude/pipeline/scripts/preflight.sh"
          test -f "$scratch/.claude/pipeline/CHANGELOG.md"
          test -f "$scratch/.claude/workflows/review.js"
          test -f "$scratch/.claude/workflows/audit.js"
          test -f "$scratch/.claude/workflows/refactor.js"
          # The per-project rendered scripts must NOT ship — only their templates.
          test ! -e "$scratch/.claude/pipeline/scripts/new-feature.sh"
          test -f "$scratch/.claude/pipeline/scripts/new-feature.sh.template"

      - name: Build dashboard
        run: npm run build:dashboard
